spring.profiles.active=dev

# Common configurations can go here
spring.application.name=pcmaster_be
# ---------- Database Configuration (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/pcmaster
spring.datasource.username=your-username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT Configuration ----------
# The secret should ideally be at least 256 bits (32 characters) for HS256
app.jwt.secret=your-jwt-secret
# Token expiration time in milliseconds (e.g., 86400000 ms = 24 hours)
app.jwt.expiration-ms=your-expire-time

# ---------- Cloudinary Configuration ----------
cloudinary.cloud_name=your_cloud_name
cloudinary.api_key=your_api_key
cloudinary.api_secret=your_api_secret

# ---------- Logging (Optional) ----------
logging.level.org.springframework.web=INFO
logging.level.com.edu.pcmaster=DEBUG


# ---------- CORS Configuration ----------
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ---------- Spring AI / Ollama Configuration ----------
# Model running: qwen2.5:7b (LLM instruction-following fast) + nomic-embed-text (768-dimension embedding)
# Ollama must be running: ollama serve or Docker container
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5:7b
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.num-gpu=99
spring.ai.ollama.chat.options.num-ctx=4096
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ---------- PGVector Configuration ----------
# initialize-schema=true will automatically create the vector_store table on startup
# Requirement: CREATE EXTENSION IF NOT EXISTS vector; must be run in PostgreSQL first
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# ---------- File Upload Configuration ----------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ---------- VNPay Configuration ----------
vnp.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp.tmnCode=${VNP_TMN_CODE:2QXUIOJY}
vnp.secretKey=${VNP_SECRET_KEY:GETTIBZETKEXQEQQMXGTHGCPCSKCHJFD}
vnp.returnUrl=${VNP_RETURN_URL:http://localhost:3000/cart/payment-callback}
vnp.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
